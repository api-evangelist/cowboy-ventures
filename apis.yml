aid: cowboy-ventures
name: Cowboy Ventures
description: >-
  Cowboy Ventures is a seed-stage venture capital firm founded in 2012 by Aileen
  Lee (who coined the term "unicorn" for billion-dollar startups) and headquartered
  in Palo Alto, California. The firm backs pre-seed and seed-stage founders building
  "life-changing" products for large and growing markets, with roughly 70% of
  investments made pre-product and a strong seed-to-Series A graduation rate. Typical
  first checks run from about $100K up to $1M, with a sweet spot near $500K–$800K.
  Cowboy invests across enterprise software, fintech, software infrastructure and
  security, healthcare, consumer, future of work, and vertical software, primarily
  in the United States. The firm has made 100+ early-stage investments and cultivates
  a curated community of founders, operators, and tech leaders. Notable portfolio
  companies include Chime, Guild, Drata, Dollar Shave Club, Ironclad, Aura, Kiavi,
  Crunchbase, and Product Hunt.
